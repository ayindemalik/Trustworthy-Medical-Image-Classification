[project]
name = "trustmed"
version = "0.1.0"
description = "Blood-cell image classifier with uncertainty, calibration and Grad-CAM explanations"
readme = "README.md"
authors = [
    { name = "Dr Malik Moustapha", email = "ayindemalik1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "medmnist>=3.0.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
trustmed = "trustmed.cli:main"


[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
